services:
  - type: web
    name: txio-telegram-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Scheduled jobs (stale reminder, bus-factor report,
    # release polling) run in-process. Free instances sleep after 15 minutes
    # without traffic, so the bot pings its own /healthz every 10 minutes
    # (KEEP_ALIVE_MINUTES).
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 3000
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      # Required: any random string; the bot registers its Telegram webhook
      # with it on start (e.g. `openssl rand -hex 32`).
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # Required: this service's public URL, e.g. https://<name>.onrender.com
      - key: PUBLIC_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: ANNOUNCE_TOKEN
        sync: false
      - key: TOPIC_THREAD_ANNOUNCEMENTS
        sync: false
      - key: ANNOUNCE_PIN
        value: "true"
      # Persistent state (announced versions, DM subscriptions). The free
      # plan's disk is wiped on each deploy, so use MongoDB.
      - key: BOT_MONGODB_URI
        sync: false
