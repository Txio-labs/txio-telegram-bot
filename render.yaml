services:
  - type: web
    name: txio-telegram-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Note: the stale reminder runs on an in-process timer, so the service
    # must stay warm (Render free instances spin down after idle time, which
    # would pause the scheduled job).
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 3000
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
